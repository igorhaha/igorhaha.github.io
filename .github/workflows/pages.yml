name: Deploy Otrada site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild site archive
        shell: bash
        run: |
          set -euo pipefail
          test -d siteparts
          test -n "$(find siteparts -maxdepth 1 -name 'otrada-site.tar.gz.part-*' -print -quit)"
          cat siteparts/otrada-site.tar.gz.part-* > /tmp/otrada-site.tar.gz
          mkdir -p _site
          tar -xzf /tmp/otrada-site.tar.gz -C _site
          test -f _site/index.html
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
